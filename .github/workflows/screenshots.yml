name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  shots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26* 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"

      - name: Generate project
        run: |
          brew install xcodegen
          bash scripts/generate-project.sh

      - name: Build for simulator
        run: |
          set -euo pipefail
          xcodebuild build -project Pulse.xcodeproj -scheme Pulse -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | tail -15

      - name: Boot simulator and capture
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name'] and 'Pro' in x['name'] and 'Max' not in x['name']]
          print(c[-1]['udid'])")
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark || true
          APP=$(find build/Build/Products -name Pulse.app -maxdepth 3 | head -1)
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          shot() { # name, extra args...
            local n=$1; shift
            xcrun simctl terminate "$UDID" app.pulse.ios 2>/dev/null || true
            xcrun simctl launch "$UDID" app.pulse.ios "$@"
            sleep 7
            xcrun simctl io "$UDID" screenshot "shots/$n.png"
          }
          shot signin
          shot home -pulseDemo -pulseTab home
          sleep 0; xcrun simctl io "$UDID" screenshot shots/home-b.png
          shot library -pulseDemo -pulseTab library
          shot people -pulseDemo -pulseTab people
          shot saved -pulseDemo -pulseTab saved
          shot search -pulseDemo -pulseTab search
          shot settings -pulseDemo -pulseSettings
          shot tonight -pulseDemo -pulseTonight
          ls -l shots

      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots
