name: Build unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pulse unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test core package
        run: swift test --filter PulseCoreTests

      - name: Archive without code signing
        run: |
          mkdir -p build
          xcodebuild \
            -project Pulse.xcodeproj \
            -scheme Pulse \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Pulse.xcarchive \
            -derivedDataPath build/DerivedData \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          rm -rf Payload Pulse-unsigned.ipa
          mkdir -p Payload
          cp -R "build/Pulse.xcarchive/Products/Applications/Pulse.app" Payload/
          zip -qry Pulse-unsigned.ipa Payload
          ls -lh Pulse-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-unsigned-ipa
          path: Pulse-unsigned.ipa
          if-no-files-found: error