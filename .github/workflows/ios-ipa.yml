name: Build unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Pulse unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26* 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          bash scripts/ci-set-build-number.sh "${{ github.run_number }}"
          bash scripts/generate-project.sh

      - name: Archive without code signing
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Pulse.xcodeproj -scheme Pulse -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Pulse.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/archive.log | grep -E "error:|warning: .*(deprecated|unavailable)|ARCHIVE" | head -60 || true
          test -d build/Pulse.xcarchive/Products/Applications/Pulse.app

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf Payload && mkdir -p Payload
          cp -R build/Pulse.xcarchive/Products/Applications/Pulse.app Payload/
          zip -qry Pulse-unsigned.ipa Payload
          ls -lh Pulse-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-unsigned-ipa
          path: Pulse-unsigned.ipa
          if-no-files-found: error

      - name: Publish release with the IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-build-${{ github.run_number }}"
          gh release create "$TAG" Pulse-unsigned.ipa \
            --title "Pulse for iOS, build ${{ github.run_number }} (unsigned)" \
            --notes "Unsigned IPA from ${{ github.ref_name }} @ ${GITHUB_SHA::7}. Sideload with AltStore or Sideloadly, or re-sign it yourself." \
            --target "${{ github.sha }}" --prerelease
